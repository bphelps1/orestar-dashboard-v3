name: Committee Contacts

# Reads ORESTAR's "Persons Associated with Committee" page for donor committees
# whose contacts are older than max_age_days → committee_persons.
# It shares ORESTAR's rate-limited lane with the other scrapers (await-orestar).

on:
  schedule:
    # Fridays 20:00 UTC — a different day from the Wednesday metadata scrape,
    # for the same reason given in filer-metadata.yml.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      max_committees:
        description: "Committees to re-read Persons Associated for (0 = skip that step)"
        required: false
        default: "400"
      max_age_days:
        description: "Re-read a committee's contacts once they are this many days old"
        required: false
        default: "30"

permissions:
  contents: read
  actions: write          # needed to requeue itself

concurrency:
  group: committee-contacts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for other ORESTAR jobs
        id: orestar_wait
        continue-on-error: true
        uses: ./.github/actions/await-orestar
        with:
          max-wait-minutes: "30"
          fail-on-timeout: "true"

      - name: Requeue after coordination timeout
        if: steps.orestar_wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dispatch_retry.sh committee-contacts.yml --ref "${{ github.ref_name }}" \
            -f max_committees="${{ github.event.inputs.max_committees || '400' }}" \
            -f max_age_days="${{ github.event.inputs.max_age_days || '30' }}"

      - name: Refuse uncoordinated committee-contact scrape
        if: steps.orestar_wait.outcome == 'failure'
        run: |
          echo "::error::ORESTAR remained busy; queued the same run instead of overlapping it."
          exit 1

      - name: Refresh branch after coordination wait
        # Run the newest scraper code if a fix landed while this run waited.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser + system dependencies
        if: github.event.inputs.max_committees != '0'
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        if: github.event.inputs.max_committees != '0'
        run: sudo apt-get install -y xvfb

      - name: Scrape committee contacts
        if: github.event.inputs.max_committees != '0'
        run: |
          xvfb-run --auto-servernum python scraper/fetch_committee_persons.py --sync \
            --max-filers "${{ github.event.inputs.max_committees || '400' }}" \
            --max-age-days "${{ github.event.inputs.max_age_days || '30' }}"
