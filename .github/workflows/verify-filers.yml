name: Verify Filer Transactions

on:
  workflow_dispatch:
    inputs:
      filer_id:
        description: "Single filer ID to verify (leave blank to auto-select by discrepancy)"
        required: false
        default: ""
      discrepancy_threshold:
        description: "Auto-select filers with discrepancy above this amount ($)"
        required: false
        default: "100"
      max_filers:
        description: "Max filers per batch (0 = all)"
        required: false
        default: "10"
      force:
        description: "Re-fetch even if already done"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: exports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for other ORESTAR jobs
        id: orestar_wait
        continue-on-error: true
        uses: ./.github/actions/await-orestar
        with:
          fail-on-timeout: "true"

      - name: Requeue after coordination timeout
        if: steps.orestar_wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dispatch_retry.sh verify-filers.yml --ref "${{ github.ref_name }}" \
            -f filer_id="${{ github.event.inputs.filer_id }}" \
            -f discrepancy_threshold="${{ github.event.inputs.discrepancy_threshold || '100' }}" \
            -f max_filers="${{ github.event.inputs.max_filers || '10' }}" \
            -f force="${{ github.event.inputs.force || 'false' }}"

      - name: Refuse uncoordinated verification
        if: steps.orestar_wait.outcome == 'failure'
        run: |
          echo "::error::ORESTAR remained busy; queued the same verification request instead of overlapping it."
          exit 1

      - name: Refresh branch after coordination wait
        # The older scraper may have published exactly the rows this report checks.
        # Verification only uploads an artifact, so replacing the pre-wait
        # snapshot with the current branch is safe and avoids false "missing"
        # findings against stale local data.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Hydrate transaction state
        run: python scripts/pipeline_state.py pull transactions

      - name: Install Playwright browser + system dependencies
        # Bounded and retried: a hung install held the ORESTAR lane for 3 hours
        # against the job's 300-minute timeout. 18 minutes is the backstop for
        # the script's own 3 x 300s cap.
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Verify filer transactions
        run: |
          FILER_ID="${{ github.event.inputs.filer_id }}"
          THRESHOLD="${{ github.event.inputs.discrepancy_threshold || '100' }}"
          MAX="${{ github.event.inputs.max_filers || '10' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          ARGS="--save-report"
          if [ -n "$FILER_ID" ]; then
            ARGS="$ARGS --filer-id $FILER_ID"
          else
            ARGS="$ARGS --discrepancy-threshold $THRESHOLD"
            if [ "$MAX" != "0" ]; then
              ARGS="$ARGS --max-filers $MAX"
            fi
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: xvfb-run python scraper/verify_filer.py $ARGS"
          xvfb-run --auto-servernum python scraper/verify_filer.py $ARGS

      - name: Upload verification reports
        if: always() && steps.orestar_wait.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: data/_verify/
          retention-days: 30
          if-no-files-found: ignore
