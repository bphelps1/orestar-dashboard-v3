name: Coverage Diff (which ROWS differ from ORESTAR)

# Compares transaction IDs against ORESTAR, committee by committee.
#
# The count survey answers "how many rows does ORESTAR have?" in one search.
# That is cheap and it is the right first pass, but it cannot settle
# completeness: ORESTAR's search returns superseded originals we drop on
# purpose, so a committee holding everything it should still reports fewer rows
# than ORESTAR, permanently. A count cannot tell "a row we should not have"
# from "a row we correctly removed", which is why that test has been wrong in
# both directions.
#
# Diffing the IDs settles it, and costs far more: this exports every complete
# leaf and recursively narrows result sets over ORESTAR's cap, where the survey
# spends one search. Sweeping all flagged committees is still days of scraping,
# so this runs as a slow rolling re-check rather than a nightly full pass — the
# point is that every committee is eventually re-measured, not that all of them
# are current at once.
#
# Order matters more than coverage here. diff_coverage.py's --recheck
# prioritises committees where withdrawn rows are actively being SUBTRACTED
# from a balance, because those are the only ones where a stale answer moves a
# number: if a filer re-files a withdrawn transaction ORESTAR counts it again,
# and until we re-measure we keep excluding it. Committees with nothing
# withdrawn can wait.
#
# Note what this workflow deliberately does NOT do: expire the withdrawn list
# by age. An earlier design ignored it once it was older than the summary being
# compared, which would have re-included Plumbers & Steamfitters PAC's sixteen
# correctly withdrawn rows — re-flagging it for $32,284.04 — on the strength of
# the calendar, with nothing having changed. Age decides what to re-measure.
# Only a measurement changes an answer.

on:
  schedule:
    # 09:00 UTC daily, well clear of the 15:00 daily refresh. One slice per day
    # against a set this size is slow on purpose: it is a rolling re-check, and
    # ORESTAR's rate limiting is the binding constraint, not our patience.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      filer_ids:
        description: "Space-separated filer IDs, or blank for flagged committees"
        required: false
        default: ""
        type: string
      start_year:
        description: "Start year used by a targeted remediation verification"
        required: false
        default: "2006"
        type: string
      end_date:
        description: "Inclusive UTC end date; frozen across remediation verification retries"
        required: false
        default: ""
        type: string
      limit:
        description: "Stop after this many committees (0 = until the time budget)"
        required: false
        default: "0"
        type: string
      recheck:
        description: "Re-diff committees already recorded, worst-staleness first"
        required: false
        default: "true"
        type: boolean
      require_no_missing:
        description: "Fail unless every targeted filer is freshly usable with zero missing IDs"
        required: false
        default: "false"
        type: boolean
      resume_auto_backfill:
        description: "Internal: resume automatic identity remediation after verification"
        required: false
        default: "false"
        type: boolean
      chain_index:
        description: "Internal: which run of the retrigger chain this is"
        required: false
        default: "1"
      verification_retry:
        description: "Internal: delayed retries already used by an exact verification gate"
        required: false
        default: "0"
      verification_parent_run_id:
        description: "Internal: failed exact-gate run holding the retry cooldown"
        required: false
        default: ""
      verification_not_before:
        description: "Internal: Unix time before which a cooled exact-gate retry must not scrape"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

# Keep only one diff run pending/running. Cross-workflow serialization is done
# by await-orestar below; sharing a concurrency group with another self-chaining
# workflow lets GitHub evict the older pending run when a third one is queued.
concurrency:
  # A pending rolling sweep may be replaced by a newer sweep, but a targeted
  # remediation gate is the only proof that a forced fetch worked. Give every
  # gate its own group; await-orestar still serializes actual site access.
  group: ${{ inputs.require_no_missing == true && format('coverage-diff-gate-{0}', github.run_id) || 'coverage-diff' }}
  cancel-in-progress: false

jobs:
  diff:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 30m coordination wait + up to 25m browser install + 70m collector + a
    # possible 20m exact-gate cooldown, with room to publish and dispatch.
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: exports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for other ORESTAR jobs
        uses: ./.github/actions/await-orestar
        with:
          # Waiting consumes the job timeout. Keep this bounded so the
          # collector's own 70-minute deadline can always stop and publish.
          max-wait-minutes: "30"
          fail-on-timeout: "true"

      - name: Honor exact-gate retry handoff
        if: inputs.verification_parent_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.verification_parent_run_id }}
          NOT_BEFORE: ${{ inputs.verification_not_before }}
        run: |
          case "$SOURCE_RUN" in
            ''|*[!0-9]*)
              echo "::error::Invalid exact-gate retry source run ID."
              exit 1
              ;;
          esac
          case "$NOT_BEFORE" in
            ''|*[!0-9]*)
              echo "::error::Invalid exact-gate retry not-before time."
              exit 1
              ;;
          esac

          # The source queues us before sleeping so later ORESTAR jobs cannot
          # take our place in line. Do not mistake a cancelled/timed-out source
          # for a completed cooldown: cancellation remains an instruction to
          # stop the chain. A short poll covers Actions API propagation after
          # await-orestar observes that the source is no longer in progress.
          STATUS=""
          CONCLUSION=""
          for ATTEMPT in 1 2 3; do
            STATE=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" \
              --jq '.status + "\t" + (.conclusion // "")' 2>/dev/null || true)
            if [ -n "$STATE" ]; then
              IFS=$'\t' read -r STATUS CONCLUSION <<< "$STATE"
            fi
            if [ "$STATUS" = "completed" ] && [ -n "$CONCLUSION" ]; then
              break
            fi
            sleep 5
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Could not confirm completion of retry source run $SOURCE_RUN."
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "::error::Retry source run $SOURCE_RUN concluded '$CONCLUSION'; refusing to continue after cancellation or an unexpected handoff."
            exit 1
          fi

          NOW=$(date +%s)
          if [ "$NOT_BEFORE" -gt "$NOW" ]; then
            REMAINING=$((NOT_BEFORE - NOW))
            if [ "$REMAINING" -gt 1500 ]; then
              echo "::error::Exact-gate retry cooldown is unexpectedly long ($REMAINING seconds)."
              exit 1
            fi
            echo "Source ended early; holding the ORESTAR lane for the remaining $REMAINING-second cooldown."
            sleep "$REMAINING"
          fi

      - name: Refresh branch after coordination wait
        # Unique remediation-gate concurrency groups prevent pending gates
        # from evicting one another. They also make this refresh essential:
        # an older gate may have published a diff/ledger while this run waited.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Hydrate coverage state
        run: python scripts/pipeline_state.py pull transactions auxiliary

      - name: Install Playwright browser + system dependencies
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        run: sudo apt-get install -y xvfb

      - name: Diff coverage
        id: diff
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.filer_ids }}" ]; then
            ARGS="$ARGS --filer-ids ${{ inputs.filer_ids }}"
          else
            ARGS="$ARGS --flagged"
          fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          # Default true, including on the schedule, where `inputs` is empty.
          # Without --recheck a scheduled run only ever measures committees
          # never seen before, so the rolling re-check would never roll — the
          # committees that matter most are precisely the ones already recorded.
          if [ "${{ inputs.recheck }}" != "false" ]; then
            ARGS="$ARGS --recheck"
          fi
          if [ -n "${{ inputs.start_year }}" ]; then
            ARGS="$ARGS --start-year ${{ inputs.start_year }}"
          fi
          END_DATE="${{ inputs.end_date }}"
          if [ -z "$END_DATE" ]; then
            END_DATE=$(date -u +%F)
          fi
          ARGS="$ARGS --end-date $END_DATE"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.require_no_missing }}" = "true" ]; then
            ARGS="$ARGS --require-no-missing"
          fi
          # Comfortably inside the time left after the bounded coordination and
          # setup steps, so the script stops on its own terms rather than being
          # killed mid-committee.
          ARGS="$ARGS --max-minutes 70"
          # An exact verification deliberately exits non-zero when IDs remain
          # missing. Bash's implicit -e would normally stop on that pipeline
          # before the counters below reached GITHUB_OUTPUT, making a genuine
          # mismatch indistinguishable from a browser that never opened. Keep
          # the collector status, publish its evidence, then return the same
          # status at the end of the step.
          set +e
          xvfb-run --auto-servernum python scraper/diff_coverage.py $ARGS 2>&1 | tee /tmp/diff.log
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          set -e
          DIFF_STATUS=${PIPE_STATUSES[0]}
          TEE_STATUS=${PIPE_STATUSES[1]:-0}
          if [ "$DIFF_STATUS" -eq 0 ] && [ "$TEE_STATUS" -ne 0 ]; then
            DIFF_STATUS=$TEE_STATUS
          fi

          # Stable counters emitted by the collector. `attempted` and
          # `unusable` make a cooldown visible; `usable` alone cannot distinguish
          # a clean slice from one that burned most of its budget filing nulls.
          RESULT=$(grep '^RUN_RESULT ' /tmp/diff.log | tail -1 || true)
          ATTEMPTED=0
          USABLE=0
          UNUSABLE=0
          BLOCKED=0
          RETRYABLE=0
          RETRY_IDS=""
          for KV in $RESULT; do
            case "$KV" in
              attempted=*) ATTEMPTED=${KV#attempted=} ;;
              usable=*)    USABLE=${KV#usable=} ;;
              unusable=*)  UNUSABLE=${KV#unusable=} ;;
              blocked=*)   BLOCKED=${KV#blocked=} ;;
              retryable=*) RETRYABLE=${KV#retryable=} ;;
              retry_ids=*) RETRY_IDS=${KV#retry_ids=} ;;
            esac
          done
          # Browser startup fails before the collector can emit RUN_RESULT.
          # Match only the exhausted final attempt: an earlier setup failure
          # can precede a successful setup and an unrelated later error.
          if [ "$DIFF_STATUS" -ne 0 ] && [ "$USABLE" -eq 0 ] && \
             grep -q 'Browser setup failed (attempt 3/3)' /tmp/diff.log; then
            RETRYABLE=1
            RETRY_IDS="${{ inputs.filer_ids }}"
          fi
          RETRY_IDS=${RETRY_IDS//,/ }
          echo "attempted=$ATTEMPTED" >> "$GITHUB_OUTPUT"
          echo "usable=$USABLE" >> "$GITHUB_OUTPUT"
          echo "unusable=$UNUSABLE" >> "$GITHUB_OUTPUT"
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
          echo "retryable=$RETRYABLE" >> "$GITHUB_OUTPUT"
          echo "retry_ids=$RETRY_IDS" >> "$GITHUB_OUTPUT"
          # Backward-compatible name used by the chain guard below.
          echo "diffed=$USABLE" >> "$GITHUB_OUTPUT"
          echo "Attempted $ATTEMPTED committees: $USABLE usable, $UNUSABLE unusable, blocked=$BLOCKED, retryable=$RETRYABLE."
          exit "$DIFF_STATUS"

      - name: Clear verified remediation progress
        id: cleanup
        if: always() && steps.diff.outcome == 'success' && inputs.require_no_missing == true
        run: |
          python scraper/fetch.py --clear-identity-progress \
            --filer-ids ${{ inputs.filer_ids }}

      # always(), NOT !cancelled().
      #
      # A job timeout is reported as "cancelled", so !cancelled() skips this
      # step exactly when it matters most. diff_coverage.py saves after every
      # committee precisely so a cut-off run keeps what it measured; a publish
      # step that refuses to run then throws all of it away. The survey learned
      # this by losing 96 committees' worth of work.
      - name: Publish diff state
        id: commit
        if: always()
        run: |
          if [ ! -f data/coverage_diff.json ]; then
            echo "No diff file — this run measured nothing to publish."
            exit 0
          fi
          python scripts/pipeline_state.py push auxiliary

      - name: Re-trigger if committees remain
        # A cancellation is an instruction to STOP. `always()` by itself made
        # cancellation impossible: the cancelled run immediately dispatched
        # its successor, which did the same when cancelled again.
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Three hard stops, because an unbounded chain that makes no progress
          # is worse than no chain: 12 runs, and a run with ZERO usable
          # committees. A rolling-sweep breaker is deliberately NOT one of
          # them; exact verification gates use the cooled recovery path below.
          #
          # 12 rather than the survey's 40. Each run here is a full 70-minute
          # budget of heavy paging, so twelve is already most of a day of the
          # ORESTAR lane. This is a rolling re-check with a daily schedule
          # behind it — yielding costs nothing, because every committee
          # measured is published and tomorrow's run picks up the staleness
          # ordering exactly where this one left off.
          CHAIN=${{ inputs.chain_index || '1' }}
          if [ "${{ steps.diff.outcome }}" != "success" ]; then
            # A targeted exact gate can fail without producing evidence when
            # F5 refuses browser startup (or after a transient unusable
            # collection). Preserve its completed fetch tree, hold the shared
            # ORESTAR lane quiet for a measured cooldown, and retry on a fresh
            # runner. A usable diff with genuinely missing IDs publishes
            # retryable=0 and stops here instead of looping.
            if [ "${{ inputs.require_no_missing }}" = "true" ] && \
               [ -n "${{ inputs.filer_ids }}" ] && \
               [ "${{ steps.diff.outputs.retryable }}" = "1" ]; then
              if [ "${{ steps.commit.outcome }}" != "success" ]; then
                echo "Retryable verification evidence was not published — stopping."
                exit 0
              fi
              bash scripts/retry_identity_gate.sh \
                "${{ inputs.verification_retry || '0' }}" \
                "${{ github.ref_name }}" \
                "${{ steps.diff.outputs.retry_ids }}" \
                "${{ inputs.start_year }}" \
                "${{ steps.diff.outputs.end_date }}" \
                "${{ inputs.resume_auto_backfill }}" \
                "${{ github.run_id }}"
              exit 0
            fi
            echo "Diff step did not finish successfully — stopping the chain."
            exit 0
          fi
          if [ "${{ steps.commit.outcome }}" != "success" ]; then
            echo "Diff results were not published successfully — stopping the chain."
            exit 0
          fi
          if [ "${{ inputs.require_no_missing }}" = "true" ] && \
             [ "${{ steps.cleanup.outcome }}" != "success" ]; then
            echo "Verified progress was not cleared successfully — stopping the chain."
            exit 0
          fi
          if [ -n "${{ inputs.filer_ids }}" ]; then
            if [ "${{ inputs.resume_auto_backfill }}" = "true" ]; then
              if [ "${{ inputs.require_no_missing }}" != "true" ]; then
                echo "resume_auto_backfill requires the no-missing verification gate."
                exit 1
              fi
              echo "Identity verification passed — resuming the automatic remediation queue."
              bash scripts/dispatch_retry.sh backfill.yml --ref "${{ github.ref_name }}" \
                -f filer_ids=auto \
                -f start_year="${{ inputs.start_year }}" \
                -f chain_index=1
            fi
            echo "Targeted filer run complete — targeted runs never chain."
            exit 0
          fi
          if [ "$CHAIN" -ge 12 ] 2>/dev/null; then
            echo "Chain limit reached ($CHAIN) — the daily schedule continues from here."
            exit 0
          fi
          # A tripped breaker is NOT automatically a reason to stop chaining.
          #
          # A fresh runner alone is not always sufficient: immediate exact-gate
          # retries have repeated the same startup refusal. Those gates take an
          # explicit 20-minute cooldown in retry_identity_gate.sh. A rolling
          # sweep, however, reaches this branch only after producing usable
          # evidence, and successor setup supplies a natural quiet interval.
          #
          # Measured, not assumed. Run 33237734544 tripped the breaker and
          # ended at 07:04. The next run started at 07:16 — twelve minutes
          # later — and measured 47 committees without blocking.
          #
          # Stopping here made the SCHEDULE the only thing that resumes the
          # sweep, because every run trips the breaker after ~48 committees. At
          # one run a day that is eleven days for the committees outstanding;
          # chaining clears the same backlog in a single chain.
          #
          # The usable==0 check below is the safety net that makes this safe to
          # try: if a block ever did follow the account, the successor would
          # measure nothing and end the chain, costing one run rather than
          # twelve.
          if [ "${{ steps.diff.outputs.usable }}" = "0" ]; then
            echo "This run produced no usable diffs — stopping rather than queueing another blocked run."
            exit 0
          fi
          NEXT=$((CHAIN + 1))
          RECHECK="${{ inputs.recheck }}"
          # Scheduled events have no inputs context. Match the collector step's
          # scheduled default instead of dispatching an empty value for a
          # boolean workflow input.
          if [ -z "$RECHECK" ]; then
            RECHECK="true"
          fi
          echo "Chaining run $NEXT..."
          bash scripts/dispatch_retry.sh coverage-diff.yml --ref ${{ github.ref_name }} \
            -f chain_index="$NEXT" \
            -f limit="${{ inputs.limit }}" \
            -f filer_ids="${{ inputs.filer_ids }}" \
            -f start_year="${{ inputs.start_year }}" \
            -f end_date="${{ steps.diff.outputs.end_date }}" \
            -f recheck="$RECHECK"
